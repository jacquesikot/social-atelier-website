# Manual deploy: publishes the Webflow site, then rebuilds and ships this site
# with whatever the CMS now holds.
#
# Publishing Webflow first is what makes CMS edits actually appear. The build
# reads Webflow's `/items/live` endpoint, which serves the last *published*
# state of the collection — so a post added or deleted in the Webflow editor
# but never published is invisible to the build, and the deploy rebuilds the
# same posts it already had.
#
# Run it from the Actions tab → "Deploy to Cloudflare" → "Run workflow".
# Deliberately manual rather than triggered by a Webflow webhook: a failed
# automatic deploy is easy to miss, whereas a run you started yourself shows
# its result.
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      publish_webflow:
        description: 'Publish the Webflow site first, so CMS edits are picked up'
        type: boolean
        default: true
      skip_blog_fetch:
        description: 'Deploy the committed posts instead of re-fetching from Webflow'
        type: boolean
        default: false

# Never let two deploys race to publish the same Worker.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify types and lint
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          yarn lint

      # `yarn build` fetches live Webflow posts and fails if the CMS is
      # unreachable, so a broken fetch never ships a site with no blog.
      # `yarn build:publish` publishes the Webflow site first, so posts added or
      # deleted in the CMS are actually reflected in what gets fetched.
      #
      # skip_blog_fetch wins over publish_webflow: it means "don't talk to
      # Webflow at all", so publishing would contradict it.
      - name: Build
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_SITE_ID }}
        run: |
          if [ "${{ inputs.skip_blog_fetch }}" = "true" ]; then
            yarn build:offline
          elif [ "${{ inputs.publish_webflow }}" = "true" ]; then
            yarn build:publish
          else
            yarn build
          fi

      - name: Show what will deploy
        run: |
          echo "### Deploy summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Posts: $(node -e 'console.log(require("./src/data/blog.json").length)')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sitemap URLs: $(grep -c '<loc>' public/sitemap.xml)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Titles:" >> "$GITHUB_STEP_SUMMARY"
          node -e 'require("./src/data/blog.json").forEach(p => console.log("- " + p.title))' >> "$GITHUB_STEP_SUMMARY"

      # Uploads a new version, then shifts all traffic to it.
      #
      # `wrangler deploy` also reconciles the custom domains in wrangler.jsonc,
      # which needs a zone-scoped Workers Routes permission that the standard
      # "Edit Cloudflare Workers" token does not grant — it fails with a 403 on
      # /zones/{id}/workers/routes even though the Worker itself uploads fine.
      # The domains are already bound and do not change between deploys, so
      # publishing a version avoids touching routes at all.
      #
      # Note: if the routes or custom domains in wrangler.jsonc ever change,
      # that change has to be applied once with `wrangler triggers deploy`
      # (or `wrangler deploy`) using a token that has the zone permission.
      # Run wrangler directly rather than via the action, so the uploaded
      # version ID can be captured and passed to the deploy step. Omitting the
      # version makes `versions deploy` resolve a default interactively, which
      # is not something to rely on in CI.
      - name: Upload and release new Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions upload | tee upload.log
          version_id=$(grep -oE 'Worker Version ID: [0-9a-f-]+' upload.log | awk '{print $NF}')
          if [ -z "$version_id" ]; then
            echo "::error::could not parse the uploaded version ID"
            exit 1
          fi
          echo "Releasing version $version_id"
          npx wrangler versions deploy "$version_id@100" --yes

      - name: Verify the deployed site
        run: |
          set -e
          for path in / /blog /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://thesocialatelierng.com$path")
            echo "$code  $path"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
