    <meta name="geo.region" content="NG-LA">
    <meta name="geo.placename" content="Lekki Phase 1, Lagos">
    <!-- geo.position/ICBM are deliberately absent. They previously held the
         Lagos mainland centroid rather than this address in Lekki, so they
         pointed several kilometres off. Location is left to the streetAddress
         in the LocalBusiness schema, which is what search engines geocode
         from. To restore a precise pin, take the exact lat/long from the
         Google Business Profile rather than deriving it by hand. -->

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://thesocialatelierng.com/#business",
      "name": "The Social Atelier",
      "url": "https://thesocialatelierng.com",
      "logo": "https://thesocialatelierng.com/logo.png",
      "description": "Premium content studio and event space in Lekki, Lagos, offering hourly rental of designed spaces for photoshoots, video, podcasts and events.",
      "email": "hello@thesocialatelierng.com",
      "telephone": "+2349031189697",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Plot 59 Chuks Onyebuchi Drive, Lekki Phase 1",
        "addressLocality": "Lekki",
        "addressRegion": "Lagos",
        "addressCountry": "NG"
      },
      "sameAs": [
        "https://instagram.com/thesocialatelierng"
      ],
      "areaServed": {
        "@type": "City",
        "name": "Lagos"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Creative Spaces",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Event Space Rental",
              "description": "Elegant spaces for creative events and gatherings"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Photo Studio Rental",
              "description": "Professional spaces for photoshoots and content creation"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Podcast Studio Rental",
              "description": "Equipped spaces for podcast recording and audio content"
            }
          }
        ]
      }
    }
    </script>
